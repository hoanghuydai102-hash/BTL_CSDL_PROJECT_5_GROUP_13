{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <div>
        <h1>{{ tieu_de }}</h1>
        <p>Nhập thông tin tuyến vận tải hành khách.</p>
    </div>
</div>

<div class="card">

    <form
        action="{% if che_do|default('them') == 'sua' %}{{ url_for('sua_tuyen_duong', ma_tuyen=tuyen.MaTuyenDuong) }}{% else %}{{ url_for('them_tuyen_duong') }}{% endif %}"
        method="POST" class="driver-form">

        <div class="driver-form-grid">

            <!-- DIEM DI -->
            <div class="form-group">
                <label>📍 Điểm đi *</label>

                <input type="text" name="DiemDi" maxlength="100" placeholder="Ví dụ: Hà Nội"
                    value="{{ tuyen.get('DiemDi', '') }}" required>
            </div>

            <!-- DIEM DEN -->
            <div class="form-group">
                <label>🏁 Điểm đến *</label>

                <input type="text" name="DiemDen" maxlength="100" placeholder="Ví dụ: Đà Nẵng"
                    value="{{ tuyen.get('DiemDen', '') }}" required>
            </div>

            <!-- CHIEU DAI -->
            <div class="form-group">
                <label>Chiều dài tuyến (km) *</label>

                <input type="number" name="ChieuDai" min="0.01" step="0.01" placeholder="Ví dụ: 760"
                    value="{{ tuyen.get('ChieuDai', '') }}" required>
            </div>

            <!-- THOI GIAN -->
            <div class="form-group">
                <label>Thời gian di chuyển (giờ) *</label>

                <input type="number" name="ThoiGianDi" min="0.01" step="0.01" placeholder="Ví dụ: 12"
                    value="{{ tuyen.get('ThoiGianDi', '') }}" required>
            </div>

            <!-- DO PHUC TAP -->
            <div class="form-group">
                <label>Độ phức tạp *</label>

                <select name="DoPhucTap" required>

                    <option value="">-- Chọn độ phức tạp --</option>

                    <option value="1" {% if tuyen.get('DoPhucTap', '' )|string=='1' %} selected {% endif %}>
                        1 - Dễ
                    </option>

                    <option value="2" {% if tuyen.get('DoPhucTap', '' )|string=='2' %} selected {% endif %}>
                        2 - Trung bình
                    </option>

                    <option value="3" {% if tuyen.get('DoPhucTap', '' )|string=='3' %} selected {% endif %}>
                        3 - Khó
                    </option>

                </select>
            </div>

            <!-- TRANG THAI -->
            <div class="form-group">
                <label>Trạng thái *</label>

                <select name="TrangThai" required>

                    <option value="1" {% if tuyen.get('TrangThai', '1' )|string=='1' %} selected {% endif %}>
                        Hoạt động
                    </option>

                    <option value="0" {% if tuyen.get('TrangThai', '1' )|string=='0' %} selected {% endif %}>
                        Ngừng hoạt động
                    </option>

                </select>
            </div>

        </div>

        <div class="driver-form-actions">

            <button type="submit" class="btn btn-primary">
                💾 Lưu tuyến đường
            </button>

            <a href="{{ url_for('danh_sach_tuyen_duong') }}" class="btn btn-secondary">
                Hủy
            </a>

        </div>

    </form>

</div>

{% endblock %}
